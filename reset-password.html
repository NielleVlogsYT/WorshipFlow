<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset password — WorshipFLOW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sea" aria-hidden="true"></div>
<div id="authScreen" class="auth-screen login-open">
  <div class="auth-floating-boxes" aria-hidden="true">
    <span style="--left: 8%; --size: 24px; --duration: 18s; --delay: 0s;"></span>
    <span style="--left: 22%; --size: 32px; --duration: 22s; --delay: 3s;"></span>
    <span style="--left: 38%; --size: 20px; --duration: 16s; --delay: 6s;"></span>
    <span style="--left: 57%; --size: 36px; --duration: 24s; --delay: 2s;"></span>
    <span style="--left: 73%; --size: 26px; --duration: 19s; --delay: 8s;"></span>
    <span style="--left: 90%; --size: 30px; --duration: 21s; --delay: 5s;"></span>
  </div>
  <div class="auth-carousel" aria-hidden="true">
    <div class="auth-carousel-track">
      <img src="src/worship-1.jpg" alt="">
      <img src="src/worship-2.jpg" alt="">
      <img src="src/worship-3.jpg" alt="">
      <img src="src/worship-4.jpg" alt="">
      <img src="src/worship-1.jpg" alt="">
      <img src="src/worship-2.jpg" alt="">
      <img src="src/worship-3.jpg" alt="">
      <img src="src/worship-4.jpg" alt="">
    </div>
  </div>
  <main class="auth-layout">
    <section class="auth-intro" aria-labelledby="welcomeHeading">
      <div class="brand auth-brand"><div class="brand-icon"></div><div><h1 id="welcomeHeading">WorshipFLOW</h1><p>(Online Musician Scheduler for CMA)</p></div></div>
    </section>
    <section class="auth-card glass-card" aria-labelledby="resetHeading">
      <form id="resetPasswordForm" class="hidden">
        <div class="auth-card-heading">
          <p class="eyebrow">SECURE YOUR ACCOUNT</p>
          <h2 id="resetHeading">Choose a new password</h2>
          <p class="muted">Use at least 6 characters for your new password.</p>
        </div>
        <label for="newPassword">New password</label>
        <div class="password-field">
          <input id="newPassword" class="input" type="password" autocomplete="new-password" minlength="6" required>
          <button class="password-toggle" type="button" data-password-target="newPassword" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle><path class="eye-slash" d="m4 4 16 16"></path></svg></button>
        </div>
        <label for="confirmNewPassword">Confirm new password</label>
        <div class="password-field">
          <input id="confirmNewPassword" class="input" type="password" autocomplete="new-password" minlength="6" required>
          <button class="password-toggle" type="button" data-password-target="confirmNewPassword" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle><path class="eye-slash" d="m4 4 16 16"></path></svg></button>
        </div>
        <button id="updatePasswordButton" class="btn btn-primary full" type="submit">Update password</button>
        <p id="resetPasswordMessage" class="form-msg" aria-live="polite"></p>
      </form>
      <div id="resetPasswordStatus" role="status" aria-live="polite">
        <div class="auth-card-heading">
          <p class="eyebrow">SECURE YOUR ACCOUNT</p>
          <h2 id="resetStatusHeading" tabindex="-1">Verifying reset link</h2>
          <p id="resetStatusMessage" class="muted">Please wait while we verify your password reset link.</p>
        </div>
        <a id="backToLogin" class="btn btn-primary full hidden" href="index.html">Back to log in</a>
      </div>
    </section>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
